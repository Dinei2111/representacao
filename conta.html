<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha conta</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📦</text></svg>">
<script src="config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="precos.js"></script>
<script src="sistema.js"></script>
</head>
<body>

<header class="topo">
  <div class="topo-linha">
    <div class="marca">
      <strong id="marca-nome">Minha conta</strong>
      <span id="marca-chamada"></span>
    </div>
    <div class="topo-acoes">
      <a class="btn-secundario" href="index.html">← Catálogo</a>
      <button id="btn-sair" class="btn-secundario" type="button" hidden>Sair</button>
    </div>
  </div>
</header>

<main class="conteudo estreita">

  <!-- entrar / cadastrar -->
  <section id="area-acesso" hidden>
    <p id="motivo" class="faixa-aviso" hidden></p>

    <div class="abas">
      <button id="aba-entrar" class="aba" aria-current="true" type="button">Entrar</button>
      <button id="aba-cadastrar" class="aba" aria-current="false" type="button">Criar cadastro</button>
    </div>

    <form id="form-entrar" class="cartao formulario">
      <h2>Entrar</h2>
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <p class="erro" hidden></p>
      <button class="btn-primario" type="submit">Entrar</button>
    </form>

    <form id="form-cadastrar" class="cartao formulario" hidden>
      <h2>Criar cadastro</h2>
      <p class="ajuda">A venda é somente para empresas com CNPJ. Depois do cadastro,
        a Opert libera seu acesso aos preços.</p>
      <label>Razão social<input name="razao_social" required autocomplete="organization"></label>
      <label>CNPJ<input name="cnpj" required inputmode="numeric" placeholder="00.000.000/0001-00"></label>
      <label>WhatsApp<input name="telefone" required inputmode="tel" placeholder="(11) 90000-0000"></label>
      <div class="dupla">
        <label>Cidade<input name="cidade" autocomplete="address-level2"></label>
        <label>UF<input name="uf" maxlength="2" autocomplete="address-level1"></label>
      </div>
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Senha<input name="senha" type="password" required minlength="6"
                          autocomplete="new-password" placeholder="mínimo 6 caracteres"></label>
      <p class="erro" hidden></p>
      <button class="btn-primario" type="submit">Criar cadastro</button>
    </form>
  </section>

  <!-- meus pedidos -->
  <section id="area-pedidos" hidden>
    <div class="cartao" id="cartao-perfil"></div>
    <h2 class="titulo-secao">Meus pedidos</h2>
    <div id="lista-pedidos"></div>
  </section>

  <p id="sem-sistema" class="vazio" hidden>
    O sistema de pedidos ainda não foi configurado. Enquanto isso, os pedidos seguem
    pelo WhatsApp direto do catálogo.
  </p>
</main>

<script src="conta.js"></script>
</body>
</html>
